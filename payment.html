  <main class="guest-info-page">
    <div class="container guest-info-container">
      <h1 class="page-title">GUEST INFORMATION</h1>
      <div class="content-wrapper">
        <!-- Booking Summary -->
        <section class="booking-details">
          <div class="booking-dates">
            <p>WED, 6 SEP 2023 → 7 SEP 2023</p>
            <p>1 Night | 1 Room, 1 Adult</p>
          </div>
          <div class="room-image">
            <img src="images/room.jpg" alt="Standard room with queen bed and window view" />
          </div>
          <div class="room-info">
            <p><strong>Standard Room</strong></p>
            <p><strong>Total</strong> <span class="price">$50.00</span></p>
          </div>
        </section>

        <!-- Guest and Payment Form -->
        <section class="guest-payment-forms">
          <form class="guest-info-form" action="#" method="post">
            <fieldset>
              <legend>Payment Information</legend>

              <!-- Form Group -->
              <div class="form-row">
                <label for="email-address">Email Address*</label>
                <input type="email" id="email-address" name="email-address" placeholder="john@example.com" required />
              </div>

              <div class="form-row">
                <label for="first-name">First Name*</label>
                <input type="text" id="first-name" name="first-name" placeholder="John" required />
              </div>

              <div class="form-row">
                <label for="last-name">Last Name*</label>
                <input type="text" id="last-name" name="last-name" placeholder="Smith" required />
              </div>

              <div class="form-row">
                <label for="phone">Phone Number*</label>
                <input type="tel" id="phone" name="phone" placeholder="12345678" required />
              </div>

              <div class="form-row">
                <label for="address-line-1">Address Line 1*</label>
                <input type="text" id="address-line-1" name="address-line-1" placeholder="123 Street" required />
              </div>

              <div class="form-row">
                <label for="address-line-2">Address Line 2</label>
                <input type="text" id="address-line-2" name="address-line-2" placeholder="Apartment, suite, etc." />
              </div>

              <div class="form-row">
                <label for="city">City*</label>
                <input type="text" id="city" name="city" placeholder="City" required />
              </div>

              <div class="form-row">
                <label for="state">State</label>
                <input type="text" id="state" name="state" placeholder="State" />
              </div>

              <div class="form-row">
                <label for="zip-code">Zip Code</label>
                <input type="text" id="zip-code" name="zip-code" placeholder="Zip Code" />
              </div>

              <div class="form-row">
                <label for="country">Country*</label>
                <input type="text" id="country" name="country" placeholder="Country" required />
              </div>
            </fieldset>

            <!-- Payment Method Section -->
            <h2 class="payment-method-heading">
              PAYMENT METHOD
              <span class="card-logos">
                <img src="images/visa.jpg" alt="Visa" />
                <img src="images/mastercard.jpg" alt="Mastercard" />
                <img src="images/discover.jpg" alt="Discover" />
              </span>
            </h2>

            <fieldset class="payment-method">
              <div class="form-row">
                <label for="card-name">Name on Card</label>
                <input type="text" id="card-name" name="card-name" placeholder="John Smith" />
              </div>

              <div class="form-row">
                <label for="card-number">Card Number</label>
                <input type="text" id="card-number" name="card-number" placeholder="XXXX XXXX XXXX XXXX" />
              </div>

              <div class="form-row expiration-cvv-row">
                <label>Expiration</label>
                <div class="expiration-inputs">
                  <input type="text" id="expiration-month" name="expiration-month" placeholder="MM" maxlength="2" />
                  <input type="text" id="expiration-year" name="expiration-year" placeholder="YYYY" maxlength="4" />
                </div>
              </div>
              <div class="form-row">
                <label for="cvv">CVV</label>
                <input type="text" id="cvv" name="cvv" placeholder="XXX" maxlength="3" />
              </div>
              <p class="total-amount">
                <strong>Total amount:</strong> <span class="amount">$50.00</span>
                <small>(inclusive of tax & service charge)</small>
              </p>
            </fieldset>

            <button type="submit" class="confirm-button">CONFIRM</button>
          </form>
        </section>
      </div>
    </div>
  </main>
